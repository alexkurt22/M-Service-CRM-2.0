name: Build APK 

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate system files
        run: flutter create --platforms=android .
        
      - name: Fix Android Manifest (Permissions & SMS)
        run: |
          cat << 'EOF' > fix_manifest.dart
          import 'dart:io';
          void main() {
            var f = File('android/app/src/main/AndroidManifest.xml');
            var text = f.readAsStringSync();
            var additions = '''
            <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent></queries>
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application
            ''';
            text = text.replaceFirst('<application', additions);
            f.writeAsStringSync(text);
          }
          EOF
          dart fix_manifest.dart

      - name: Install dependencies
        run: flutter pub get

      # === ВЫРАВНИВАЕМ ВЕРСИИ PROTOBUF ===
      - name: Fix Protobuf Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle.kts
          
          configurations.all {
              resolutionStrategy.force("com.google.protobuf:protobuf-javalite:3.21.7")
          }
          EOF

      # === ЗАЩИТА ОТ УДАЛЕНИЯ КЛАССОВ ПРИ СЖАТИИ R8 (PROGUARD) ===
      - name: Add ProGuard Rules
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn de.mintware.barcode_scan.**
          -dontwarn com.google.protobuf.**
          -keep class com.google.protobuf.** { *; }
          -keep class com.google.rpc.** { *; }
          -keep class com.google.type.** { *; }
          -dontwarn com.google.rpc.**
          -dontwarn com.google.type.**
          EOF

      - name: Fix Android SDK versions and kill JNI bug
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24\n        multiDexEnabled = true/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24\n        multiDexEnabled true/g' android/app/build.gradle 2>/dev/null || true
          
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} +
          
          find /home/runner/.pub-cache/hosted -path "*/jni-*/android/build.gradle" -exec perl -0777 -pi -e 's/kotlin\s*\{[^}]*\}//g' {} + || true

      # === ГЕНЕРАЦИЯ ВРЕМЕННОГО КЛЮЧА И УМНАЯ РАСШИФРОВКА FIREBASE ===
      - name: Inject Secret Keys and Generate Keystore
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p assets
          
          # Умная проверка для Firebase Service Account
          if echo "$FIREBASE_SECRET" | tr -d '\n\r ' | base64 -d > /dev/null 2>&1; then
            echo "$FIREBASE_SECRET" | tr -d '\n\r ' | base64 -d > assets/firebase_credentials.json
          else
            echo "$FIREBASE_SECRET" > assets/firebase_credentials.json
          fi
          
          # Умная проверка для Google Services JSON
          if [ -n "$GOOGLE_SERVICES" ]; then
            if echo "$GOOGLE_SERVICES" | tr -d '\n\r ' | base64 -d > /dev/null 2>&1; then
              echo "$GOOGLE_SERVICES" | tr -d '\n\r ' | base64 -d > android/app/google-services.json
            else
              echo "$GOOGLE_SERVICES" > android/app/google-services.json
            fi
          fi
          
          # СОЗДАЕМ ОДНОРАЗОВЫЙ КЛЮЧ (KEYSTORE ИЗ СЕКРЕТОВ БОЛЬШЕ НЕ НУЖЕН!)
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 1000 -alias upload -storepass mservice123 -keypass mservice123 -dname "CN=Test, OU=Test, O=MService, L=Ashgabat, S=Ahal, C=TM"
          
          cat << 'EOF' > setup_signing.dart
          import 'dart:io';
          void main() {
            var kts = File('android/app/build.gradle.kts');
            var gradle = File('android/app/build.gradle');
            if (kts.existsSync()) {
              var text = kts.readAsStringSync();
              text = text.replaceFirst(
                'buildTypes {',
                'signingConfigs {\n        create("release") {\n            storeFile = file("upload-keystore.jks")\n            storePassword = "mservice123"\n            keyAlias = "upload"\n            keyPassword = "mservice123"\n        }\n    }\n    buildTypes {'
              );
              text = text.replaceAll('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")');
              text = text.replaceAll('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.getByName("release")\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")');
              kts.writeAsStringSync(text);
            } else if (gradle.existsSync()) {
              var text = gradle.readAsStringSync();
              text = text.replaceFirst(
                'buildTypes {',
                'signingConfigs {\n        release {\n            storeFile file("upload-keystore.jks")\n            storePassword "mservice123"\n            keyAlias "upload"\n            keyPassword "mservice123"\n        }\n    }\n    buildTypes {'
              );
              text = text.replaceAll('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release');
              text = text.replaceAll('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"');
              gradle.writeAsStringSync(text);
            }
          }
          EOF
          dart setup_signing.dart

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Rename APK with Date and Time
        run: |
          export TZ="Asia/Ashgabat"
          BUILD_TIME=$(date +'%d-%m-%Y_%H-%M')
          NEW_NAME="MService_CRM_v1.0.${{ github.run_number }}_${BUILD_TIME}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/$NEW_NAME
          echo "FINAL_APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "FINAL_ZIP_NAME=MService_CRM_v1.0.${{ github.run_number }}_${BUILD_TIME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.FINAL_APK_NAME }}

