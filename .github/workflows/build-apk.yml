name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate system files
        run: |
          rm -rf android
          flutter create -t app --platforms=android .
        
      - name: Fix Android Manifest (Permissions & SMS)
        run: |
          cat << 'EOF' > fix_manifest.dart
          import 'dart:io';
          void main() {
            var f = File('android/app/src/main/AndroidManifest.xml');
            var text = f.readAsStringSync();
            var additions = '''
            <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent></queries>
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application
            ''';
            text = text.replaceFirst('<application', additions);
            f.writeAsStringSync(text);
          }
          EOF
          dart fix_manifest.dart

      # === ИСПРАВЛЕННЫЙ ШАГ: ПРАВИЛЬНОЕ ДОБАВЛЕНИЕ ПЛАГИНА GOOGLE SERVICES ===
      - name: Link Google Services Plugin
        run: |
          cat << 'EOF' > fix_google_services.dart
          import 'dart:io';
          void main() {
            var settings = File('android/settings.gradle');
            if (settings.existsSync()) {
              var text = settings.readAsStringSync();
              if (text.contains('plugins {') && !text.contains('com.google.gms.google-services')) {
                text = text.replaceFirst(
                  'plugins {',
                  'plugins {\n        id "com.google.gms.google-services" version "4.4.1" apply false'
                );
                settings.writeAsStringSync(text);
              }
            }
            
            var rootGradle = File('android/build.gradle');
            if (rootGradle.existsSync()) {
              var text = rootGradle.readAsStringSync();
              if (!text.contains('com.google.gms:google-services')) {
                text = text.replaceFirst(
                  'dependencies {',
                  'dependencies {\n        classpath "com.google.gms:google-services:4.4.1"'
                );
                rootGradle.writeAsStringSync(text);
              }
            }
            
            var appGradle = File('android/app/build.gradle');
            if (appGradle.existsSync()) {
              var text = appGradle.readAsStringSync();
              if (!text.contains('com.google.gms.google-services')) {
                appGradle.writeAsStringSync(text + "\napply plugin: 'com.google.gms.google-services'\n");
              }
            }
            
            var appKts = File('android/app/build.gradle.kts');
            if (appKts.existsSync()) {
              var text = appKts.readAsStringSync();
              if (!text.contains('com.google.gms.google-services')) {
                appKts.writeAsStringSync(text + '\napply(plugin = "com.google.gms.google-services")\n');
              }
            }
          }
          EOF
          dart fix_google_services.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Protobuf Duplicate Classes (Kotlin DSL)
        run: |
          cat << 'EOF' >> android/app/build.gradle.kts
          
          configurations.all {
              exclude(group = "com.google.firebase", module = "protolite-well-known-types")
              exclude(group = "com.google.protobuf", module = "protobuf-lite")
          }
          EOF

      - name: Add ProGuard Rules for Firestore
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.rpc.** { *; }
          -keep class com.google.type.** { *; }
          -keep class com.google.firebase.firestore.** { *; }
          -dontwarn com.google.rpc.**
          -dontwarn com.google.type.**
          EOF

      - name: Fix Android SDK versions and kill JNI bug
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} +
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk = 33/compileSdk = 36/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk = 33/targetSdk = 34/g' android/app/build.gradle.kts 2>/dev/null || true
          
          find /home/runner/.pub-cache/hosted -path "*/jni-*/android/build.gradle" -exec perl -0777 -pi -e 's/kotlin\s*\{[^}]*\}//g' {} + || true

      - name: Inject Secret Keys, Firebase config and Generate Keystore
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p assets
          cat << EOF > assets/firebase_credentials.json
          $FIREBASE_SECRET
          EOF
          
          cat << EOF > android/app/google-services.json
          $GOOGLE_SERVICES
          EOF
          
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 1000 -alias upload -storepass mservice123 -keypass mservice123 -dname "CN=Test, OU=Test, O=MService, L=Ashgabat, S=Ahal, C=TM"
          
          cat << 'EOF' > setup_signing.dart
          import 'dart:io';
          void main() {
            var kts = File('android/app/build.gradle.kts');
            var gradle = File('android/app/build.gradle');
            if (kts.existsSync()) {
              var text = kts.readAsStringSync();
              text = text.replaceFirst(
                'buildTypes {',
                'signingConfigs {\n        create("release") {\n            storeFile = file("upload-keystore.jks")\n            storePassword = "mservice123"\n            keyAlias = "upload"\n            keyPassword = "mservice123"\n        }\n    }\n    buildTypes {'
              );
              text = text.replaceAll(
                'signingConfigs.getByName("debug")', 
                'signingConfigs.getByName("release")\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              );
              kts.writeAsStringSync(text);
            } else if (gradle.existsSync()) {
              var text = gradle.readAsStringSync();
              text = text.replaceFirst(
                'buildTypes {',
                'signingConfigs {\n        release {\n            storeFile file("upload-keystore.jks")\n            storePassword "mservice123"\n            keyAlias "upload"\n            keyPassword "mservice123"\n        }\n    }\n    buildTypes {'
              );
              text = text.replaceAll(
                'signingConfig signingConfigs.debug', 
                'signingConfig signingConfigs.release\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
              );
              gradle.writeAsStringSync(text);
            }
          }
          EOF
          dart setup_signing.dart

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --no-shrink

      - name: Rename APK with Date and Time
        run: |
          export TZ="Asia/Ashgabat"
          BUILD_TIME=$(date +'%d-%m-%Y_%H-%M')
          NEW_NAME="MService_CRM_v1.0.${{ github.run_number }}_${BUILD_TIME}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/$NEW_NAME
          echo "FINAL_APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "FINAL_ZIP_NAME=MService_CRM_v1.0.${{ github.run_number }}_${BUILD_TIME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.FINAL_APK_NAME }}

