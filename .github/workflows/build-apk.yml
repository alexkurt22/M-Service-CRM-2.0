name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate system files
        run: |
          rm -rf android
          flutter create -t app --platforms=android .
        
      - name: Fix Android Manifest (Permissions & SMS)
        run: |
          cat << 'EOF' > fix_manifest.dart
          import 'dart:io';
          void main() {
            var f = File('android/app/src/main/AndroidManifest.xml');
            var text = f.readAsStringSync();
            var additions = '''
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent></queries>
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application
            ''';
            text = text.replaceFirst('<application', additions);
            f.writeAsStringSync(text);
          }
          EOF
          dart fix_manifest.dart

      - name: Link Google Services Plugin
        run: |
          cat << 'EOF' > fix_google_services.dart
          import 'dart:io';
          void main() {
            var sKts = File('android/settings.gradle.kts');
            if (sKts.existsSync()) {
              var txt = sKts.readAsStringSync();
              if (!txt.contains('com.google.gms.google-services')) {
                txt = txt.replaceFirst('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false');
                sKts.writeAsStringSync(txt);
              }
            }
            var sGr = File('android/settings.gradle');
            if (sGr.existsSync()) {
              var txt = sGr.readAsStringSync();
              if (!txt.contains('com.google.gms.google-services')) {
                txt = txt.replaceFirst('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false');
                sGr.writeAsStringSync(txt);
              }
            }
            var aKts = File('android/app/build.gradle.kts');
            if (aKts.existsSync()) {
              var txt = aKts.readAsStringSync();
              if (!txt.contains('com.google.gms.google-services')) {
                txt = txt.replaceFirst('plugins {', 'plugins {\n    id("com.google.gms.google-services")');
                aKts.writeAsStringSync(txt);
              }
            }
            var aGr = File('android/app/build.gradle');
            if (aGr.existsSync()) {
              var txt = aGr.readAsStringSync();
              if (!txt.contains('com.google.gms.google-services')) {
                txt = txt.replaceFirst('plugins {', 'plugins {\n    id "com.google.gms.google-services"');
                aGr.writeAsStringSync(txt);
              }
            }
          }
          EOF
          dart fix_google_services.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Android SDK versions and kill JNI bug
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # === ИСПРАВЛЕНИЕ КРАША FIRESTORE: ПОВЫШАЕМ MIN SDK ДО 24 И ВЛЮЧАЕМ MULTIDEX ===
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24\n        multiDexEnabled true/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24\n        multiDexEnabled = true/g' android/app/build.gradle.kts 2>/dev/null || true
          
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} +
          find /home/runner/.pub-cache/hosted -name "build.gradle" -type f -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} +
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk = 33/compileSdk = 36/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk = 33/targetSdk = 34/g' android/app/build.gradle.kts 2>/dev/null || true
          
          find /home/runner/.pub-cache/hosted -path "*/jni-*/android/build.gradle" -exec perl -0777 -pi -e 's/kotlin\s*\{[^}]*\}//g' {} + || true

      - name: Sync Package Name and Generate Keystore
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p assets
          cat << EOF > assets/firebase_credentials.json
          $FIREBASE_SECRET
          EOF
          
          echo "$GOOGLE_SERVICES" | tr -d '\n\r ' | base64 --decode > android/app/google-services.json
          
          cat << 'EOF' > sync_package.dart
          import 'dart:io';
          import 'dart:convert';
          
          void main() {
            var optionsFile = File('lib/firebase_options.dart');
            if (!optionsFile.existsSync()) return;
            var text = optionsFile.readAsStringSync();
            
            RegExp exp = RegExp(r"appId:\s*['\x22](1:[^\x22']+:android:[^\x22']+)['\x22']");
            var match = exp.firstMatch(text);
            if (match == null) return;
            
            String appId = match.group(1)!;
            
            var gsFile = File('android/app/google-services.json');
            if (!gsFile.existsSync()) return;
            var gsData = jsonDecode(gsFile.readAsStringSync());
            
            String? pkgName;
            for (var client in gsData['client']) {
              if (client['client_info']['mobilesdk_app_id'] == appId) {
                pkgName = client['client_info']['android_client_info']['package_name'];
                break;
              }
            }
            
            if (pkgName == null) return;
            
            var kts = File('android/app/build.gradle.kts');
            if (kts.existsSync()) {
              var ktsText = kts.readAsStringSync();
              ktsText = ktsText.replaceAll(RegExp(r'applicationId\s*=\s*".*"'), 'applicationId = "$pkgName"');
              ktsText = ktsText.replaceAll(RegExp(r'namespace\s*=\s*".*"'), 'namespace = "$pkgName"');
              kts.writeAsStringSync(ktsText);
            }
            
            var dir = Directory('android/app/src/main');
            if (dir.existsSync()) {
              var files = dir.listSync(recursive: true);
              for (var f in files) {
                if (f is File && (f.path.endsWith('MainActivity.kt') || f.path.endsWith('MainActivity.java'))) {
                  var content = f.readAsStringSync();
                  if (f.path.endsWith('MainActivity.java')) {
                    content = content.replaceFirst(RegExp(r'package\s+.*'), 'package $pkgName;');
                  } else {
                    content = content.replaceFirst(RegExp(r'package\s+.*'), 'package $pkgName');
                  }
                  f.writeAsStringSync(content);
                }
              }
            }
          }
          EOF
          dart sync_package.dart
          
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 1000 -alias upload -storepass mservice123 -keypass mservice123 -dname "CN=Test, OU=Test, O=MService, L=Ashgabat, S=Ahal, C=TM"
          
          cat << 'EOF' > setup_signing.dart
          import 'dart:io';
          void main() {
            var kts = File('android/app/build.gradle.kts');
            var gradle = File('android/app/build.gradle');
            if (kts.existsSync()) {
              var text = kts.readAsStringSync();
              text = text.replaceFirst(
                'buildTypes {',
                'signingConfigs {\n        create("release") {\n            storeFile = file("upload-keystore.jks")\n            storePassword = "mservice123"\n            keyAlias = "upload"\n            keyPassword = "mservice123"\n        }\n    }\n    buildTypes {'
              );
              text = text.replaceAll(
                'signingConfigs.getByName("debug")', 
                'signingConfigs.getByName("release")\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
              );
              kts.writeAsStringSync(text);
            } else if (gradle.existsSync()) {
              var text = gradle.readAsStringSync();
              text = text.replaceFirst(
                'buildTypes {',
                'signingConfigs {\n        release {\n            storeFile file("upload-keystore.jks")\n            storePassword "mservice123"\n            keyAlias "upload"\n            keyPassword "mservice123"\n        }\n    }\n    buildTypes {'
              );
              text = text.replaceAll(
                'signingConfig signingConfigs.debug', 
                'signingConfig signingConfigs.release\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
              );
              gradle.writeAsStringSync(text);
            }
          }
          EOF
          dart setup_signing.dart

      - name: Build APK
        run: flutter build apk --debug --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Rename APK with Date and Time
        run: |
          export TZ="Asia/Ashgabat"
          BUILD_TIME=$(date +'%d-%m-%Y_%H-%M')
          NEW_NAME="MService_CRM_v1.0.${{ github.run_number }}_${BUILD_TIME}_DEBUG.apk"
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/$NEW_NAME
          echo "FINAL_APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "FINAL_ZIP_NAME=MService_CRM_v1.0.${{ github.run_number }}_${BUILD_TIME}_DEBUG" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.FINAL_APK_NAME }}
