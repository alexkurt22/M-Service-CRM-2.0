name: mservice_crm
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # --- Core & UI ---
  cupertino_icons: ^1.0.8
  intl: ^0.18.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  share_plus: ^12.0.2       # <--- ОБНОВИЛИ ВЕРСИЮ ЗДЕСЬ
  
  # --- Firebase Services ---
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  
  # --- Google API (Push Notifications & Monitoring) ---
  googleapis_auth: ^1.4.1
  googleapis: ^13.0.0
  http: ^1.2.0
  
  # --- Media, Files & Hardware ---
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  mobile_scanner: ^5.0.3        
  permission_handler: ^11.3.1   

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firebase_credentials.json
